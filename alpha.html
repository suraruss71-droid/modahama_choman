<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هێزی ئەلفا - ئۆپەراسیۆنی مەیدانی</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #030712;
            --panel-bg: rgba(11, 19, 43, 0.94);
            --panel-border: #1e293b;
            --cyan-accent: #00ffcc;
            --blue-accent: #3b82f6;
            --red-accent: #ef4444;
            --gold-accent: #f59e0b;
            --green-accent: #10b981;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-deep); color: var(--cyan-accent); overflow-x: hidden; }

        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover; filter: brightness(0.2) contrast(1.2);
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85); z-index: -1;
        }

        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px;
        }
        .login-box {
            background: var(--panel-bg); border: 2px solid var(--cyan-accent); padding: 30px;
            border-radius: 12px; max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25); backdrop-filter: blur(8px);
        }
        .login-box h2 { color: var(--cyan-accent); font-size: 22px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 12px; background: #020617;
            border: 1px solid var(--panel-border); color: #fff; border-radius: 6px;
            font-size: 14px; text-align: center;
        }

        #main-app { display: none; padding: 12px; max-width: 520px; margin: auto; position: relative; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 10px 14px;
            border-radius: 10px; margin-bottom: 10px; backdrop-filter: blur(6px);
        }
        
        .dash-info-bar {
            background: rgba(2, 6, 23, 0.9); border: 1px solid var(--panel-border);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 11px;
            display: flex; justify-content: space-between; align-items: center; color: var(--cyan-accent);
        }

        #map { height: 320px; border-radius: 10px; border: 1px solid var(--panel-border); margin-bottom: 10px; z-index: 1; }

        .controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
        }

        .volume-box {
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--panel-border);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 12px;
            display: flex; align-items: center; justify-content: space-between; color: white;
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white;
            border: none; padding: 12px; border-radius: 8px; cursor: pointer;
            font-size: 14px; width: 100%; font-weight: bold; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-sos {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); margin-top: 5px;
        }
        .btn-mic {
            background: rgba(30, 41, 59, 0.9); color: var(--cyan-accent);
            border: 1px solid var(--blue-accent);
        }
        .btn-mic.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #030712; border-color: var(--gold-accent);
        }

        .msg-fab {
            position: fixed; bottom: 20px; left: 20px;
            background: var(--blue-accent); color: white; width: 52px; height: 52px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 2px solid white;
        }
        .msg-badge {
            position: absolute; top: -3px; right: -3px; background: var(--red-accent);
            color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        #msgModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75); z-index: 10000; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .msg-modal-content {
            background: var(--panel-bg); border: 1px solid var(--cyan-accent);
            width: 90%; max-width: 440px; border-radius: 10px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .messages-list {
            height: 240px; overflow-y: auto; background: #020617;
            border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; margin-top: 10px;
        }
        .msg-item {
            padding: 6px 10px; margin-bottom: 6px; border-radius: 6px;
            background: rgba(30, 41, 59, 0.7); border-right: 3px solid var(--blue-accent);
            font-size: 12px; color: #f8fafc;
        }
        .msg-item.commander { border-right-color: var(--gold-accent); background: rgba(245, 158, 11, 0.15); }
        .msg-item.sos { border-right-color: var(--red-accent); background: rgba(239, 68, 68, 0.15); }

        .status-msg { margin-top: 8px; color: var(--green-accent); font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-grid-loop-31804-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="login-screen">
        <div class="login-box">
            <h2>🛡️ چوونەژوورەوەی یەکەی ئەلفا</h2>
            <div class="input-group">
                <label>کلیل یان ناوی یەکە (نموونە: Alpha 1):</label>
                <input type="text" id="api-key-input" placeholder="Alpha 1">
            </div>
            <button class="btn" onclick="login()">چوونەژوورەوە 🔑</button>
            <div id="login-error" style="color:var(--red-accent); font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <div id="main-app">
        <div class="header-bar">
            <div>یەکە: <span id="unit-name-display" style="color:var(--green-accent); font-weight:bold;">-</span></div>
            <button id="mic-btn" class="btn btn-mic" style="width: auto; margin:0; padding:6px 12px;" onclick="toggleMicrophone()">🎙️ بێسیم WebRTC: OFF</button>
        </div>

        <div class="dash-info-bar">
            <span id="coord-display">📍 پۆتان: دیاری نەکراوە</span>
            <span id="weather-info">🌤️ --°C</span>
        </div>

        <div id="map"></div>

        <div class="volume-box">
            <label for="volControl">🔊 ئاستی دەنگی بێسیم:</label>
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="1" onchange="adjustVolume(this.value)">
        </div>

        <div class="controls-grid">
            <button class="btn" onclick="centerOnMe()">🧭 شوێنی من</button>
            <button class="btn" style="background: linear-gradient(135deg, #059669, #047857);" onclick="startGPS()">📡 دەستپێکردنی GPS</button>
        </div>

        <button class="btn btn-sos" onclick="sendSOS()">🚨 ناردنی نیشانەی مەترسی بەپەلە (SOS)</button>
        <p id="statusText" class="status-msg"></p>
    </div>

    <div class="msg-fab" onclick="toggleMsgModal()">
        📩
        <div class="msg-badge" id="unreadBadge" style="display:none;">0</div>
    </div>

    <div id="msgModal">
        <div class="msg-modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="color:var(--cyan-accent); font-size:14px;">📜 سندوقی فەرمان و پەیامەکان</h3>
                <button onclick="toggleMsgModal()" style="background:var(--red-accent); color:white; border:none; border-radius:4px; padding:2px 8px; cursor:pointer;">✕</button>
            </div>
            <div class="messages-list" id="inboxList">
                <div class="msg-item"><b>سیستەم:</b> بەخێربێیت بۆ بەشی ئەلفای مەیدانی.</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        let map, userMarker, targetMarker;
        let currentUnitName = "";
        let watchId = null;
        let unreadCount = 0;

        // متغیڕەکانی WebRTC بۆ پەیوەندییە دەنگییە ڕاستەوخۆکانی دوو قۆڵی و کۆمەڵەیی بە کوالێتی بەرز
        let micActive = false;
        let localAudioStream = null;
        let peerConnections = {};
        let remoteAudioElements = {};

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function login() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return;
            socket.emit('register_alpha', { apiKey: key });
        }

        socket.on('registration_status', (res) => {
            if (res.success) {
                currentUnitName = res.alphaName;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('unit-name-display').innerText = currentUnitName;
                
                initMap();
                requestPermissions();
            } else {
                document.getElementById('login-error').innerText = res.message || 'کلیلی سەربازی هەڵەیە!';
            }
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([36.19, 44.01], 15);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22,
                maxNativeZoom: 18,
                attribution: 'Esri Satellite'
            }).addTo(map);

            L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22,
                maxNativeZoom: 18,
                opacity: 0.8
            }).addTo(map);
        }

        async function requestPermissions() {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if (navigator.geolocation) {
                    startGPS();
                }
            } catch (err) {
                console.warn("مۆڵەتی مایکرۆفۆن یان لوکەیشن نەدراوە.");
            }
        }

        function startGPS() {
            if (!navigator.geolocation) return;
            document.getElementById('statusText').innerText = "پەیوەندی لەگەڵ ژووری ئۆپەراسیۆن چالاکە، پۆتانەکان دەنێردرێن...";

            if (watchId) navigator.geolocation.clearWatch(watchId);

            watchId = navigator.geolocation.watchPosition((position) => {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let heading = position.coords.heading || 0;

                document.getElementById('coord-display').innerText = `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                if (!userMarker) {
                    userMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${currentUnitName} (تۆ)</b>`).openPopup();
                } else {
                    userMarker.setLatLng([lat, lon]);
                }
                map.setView([lat, lon], 16);

                socket.emit('updateLocation', {
                    id: currentUnitName,
                    lat: lat,
                    lon: lon,
                    heading: heading,
                    status: 'ئامادەباش',
                    lastSeen: Date.now()
                });

                fetchWeather(lat, lon);
            }, (error) => {
                document.getElementById('statusText').innerText = 'هەڵە لە وەرگرتنی GPS!';
            }, { enableHighAccuracy: true });
        }

        function fetchWeather(lat, lon) {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.current_weather) {
                        document.getElementById('weather-info').innerText = `🌤️ ${Math.round(data.current_weather.temperature)}°C`;
                    }
                }).catch(() => {});
        }

        function centerOnMe() {
            if (userMarker) {
                map.setView(userMarker.getLatLng(), 17);
            }
        }

        // 🌟 سیستەمی پێشکەوتووی WebRTC بۆ پەیوەندی دەنگی ڕاستەوخۆی دوو قۆڵی و کۆمەڵەیی
        async function toggleMicrophone() {
            const btn = document.getElementById('mic-btn');
            try {
                if (!micActive) {
                    localAudioStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            channelCount: 1,
                            sampleRate: 48000
                        }
                    });

                    micActive = true;
                    btn.innerText = "🎙️ بێسیم WebRTC: ON (پەخش)";
                    btn.classList.add('active');

                    socket.emit('webrtc_join_audio', { role: currentUnitName });

                } else {
                    if (localAudioStream) {
                        localAudioStream.getTracks().forEach(track => track.stop());
                        localAudioStream = null;
                    }

                    Object.keys(peerConnections).forEach(peerId => {
                        if (peerConnections[peerId]) {
                            peerConnections[peerId].close();
                            delete peerConnections[peerId];
                        }
                    });

                    micActive = false;
                    btn.innerText = "🎙️ بێسیم WebRTC: OFF";
                    btn.classList.remove('active');

                    socket.emit('webrtc_leave_audio');
                }
            } catch (err) {
                alert('ڕێگەپێدانی مایکرۆفۆن سەرکەوتوو نەبوو!');
            }
        }

        socket.on('webrtc_peer_list', async (peers) => {
            if (!micActive || !localAudioStream) return;
            for (let peerId of peers) {
                if (!peerConnections[peerId]) {
                    setupPeerConnection(peerId, true);
                }
            }
        });

        socket.on('webrtc_offer', async (data) => {
            const { from, offer } = data;
            let pc = setupPeerConnection(from, false);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            let answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc_answer', { target: from, answer: answer });
        });

        socket.on('webrtc_answer', async (data) => {
            const { from, answer } = data;
            if (peerConnections[from]) {
                await peerConnections[from].setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        socket.on('webrtc_ice_candidate', async (data) => {
            const { from, candidate } = data;
            if (peerConnections[from] && candidate) {
                try {
                    await peerConnections[from].addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding ice candidate', e);
                }
            }
        });

        function setupPeerConnection(peerId, isInitiator) {
            if (peerConnections[peerId]) return peerConnections[peerId];

            let pc = new RTCPeerConnection(rtcConfig);
            peerConnections[peerId] = pc;

            if (localAudioStream) {
                localAudioStream.getTracks().forEach(track => {
                    pc.addTrack(track, localAudioStream);
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_ice_candidate', { target: peerId, candidate: event.candidate });
                }
            };

            pc.ontrack = (event) => {
                if (!remoteAudioElements[peerId]) {
                    let audioEl = document.createElement('audio');
                    audioEl.autoplay = true;
                    let slider = document.getElementById('volControl');
                    audioEl.volume = slider ? slider.value : 1;
                    audioEl.srcObject = event.streams[0];
                    document.body.appendChild(audioEl);
                    remoteAudioElements[peerId] = audioEl;
                }
            };

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('webrtc_offer', { target: peerId, offer: offer });
                });
            }

            return pc;
        }

        socket.on('webrtc_peer_disconnected', (peerId) => {
            if (peerConnections[peerId]) {
                peerConnections[peerId].close();
                delete peerConnections[peerId];
            }
            if (remoteAudioElements[peerId]) {
                remoteAudioElements[peerId].remove();
                delete remoteAudioElements[peerId];
            }
        });

        function adjustVolume(val) {
            Object.values(remoteAudioElements).forEach(audio => audio.volume = val);
        }

        function sendSOS() {
            navigator.geolocation.getCurrentPosition((pos) => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;

                socket.emit('updateLocation', {
                    id: currentUnitName,
                    lat: lat,
                    lon: lon,
                    heading: 0,
                    status: 'SOS',
                    lastSeen: Date.now()
                });

                socket.emit('sosAlert', {
                    sender: currentUnitName,
                    time: new Date().toLocaleTimeString()
                });

                socket.emit('sendEmergencyMessage', {
                    sender: currentUnitName,
                    text: '🚨 هاواری بەپەلە (SOS) ڕەوانەکرا!',
                    type: 'SOS'
                });

                addMessageToInbox('🚨 **SOS**', 'نیشانەی مەترسی بەپەلە نێردرا بۆ فەرماندە!', 'sos');
                alert('⚠️ نیشانەی مەترسی (SOS) ڕەوانەکرا!');
            });
        }

        socket.on('presidentBroadcast', (data) => {
            addMessageToInbox(data.sender || 'فەرماندەی گشتی', data.text, 'commander');
        });

        socket.on('receiveMessage', (data) => {
            addMessageToInbox(data.sender, data.text, 'normal');
        });

        const handleCommanderTarget = (data) => {
            if (targetMarker) map.removeLayer(targetMarker);
            targetMarker = L.marker([data.lat, data.lon], {
                icon: L.divIcon({ className: 'custom-target', html: '🎯', iconSize: [30, 30] })
            }).addTo(map).bindPopup("<b>ئامانجی نێردراوی فەرماندە</b>").openPopup();
            
            map.setView([data.lat, data.lon], 16);
            addMessageToInbox('فەرماندەیی', 'ئامانجێکی نوێ لەسەر نەخشەکە دیاریکرا!', 'commander');
        };

        socket.on('update_commander_target', handleCommanderTarget);
        socket.on('set_commander_target', handleCommanderTarget);

        function addMessageToInbox(sender, text, type) {
            const inbox = document.getElementById('inboxList');
            const item = document.createElement('div');
            item.className = `msg-item ${type}`;
            item.innerHTML = `<b>${sender}:</b> ${text}<br><span style="font-size:9px; opacity:0.7;">${new Date().toLocaleTimeString()}</span>`;
            
            inbox.insertBefore(item, inbox.firstChild);
            
            unreadCount++;
            const badge = document.getElementById('unreadBadge');
            badge.innerText = unreadCount;
            badge.style.display = 'flex';
        }

        function toggleMsgModal() {
            const modal = document.getElementById('msgModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                unreadCount = 0;
                document.getElementById('unreadBadge').style.display = 'none';
            }
        }
    </script>
</body>
</html>
