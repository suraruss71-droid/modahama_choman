<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هێزی ئەلفا - ئۆپەراسیۆنی مەیدانی</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-deep: #020617;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(0, 255, 204, 0.15);
            --cyan-accent: #00ffcc;
            --blue-accent: #3b82f6;
            --red-accent: #ef4444;
            --gold-accent: #f59e0b;
            --green-accent: #10b981;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at center, #0f172a 0%, var(--bg-deep) 100%); color: var(--cyan-accent); overflow-x: hidden; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover; filter: brightness(0.2) contrast(1.2);
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.7); z-index: -1; backdrop-filter: blur(8px);
        }

        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px;
        }
        .login-box {
            padding: 40px; max-width: 420px; width: 100%; text-align: center;
        }
        .login-box h2 { color: var(--cyan-accent); font-size: 22px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px;
            font-size: 14px; text-align: center; outline: none; transition: border 0.3s;
        }
        .input-group input:focus { border-color: var(--cyan-accent); }

        #main-app { display: none; padding: 15px; max-width: 520px; margin: auto; position: relative; z-index: 10; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; margin-bottom: 12px;
        }
        
        .dash-info-bar {
            padding: 10px 15px; margin-bottom: 12px; font-size: 12px;
            display: flex; justify-content: space-between; align-items: center; color: var(--cyan-accent);
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
        }

        #map { height: 300px; border-radius: 16px; border: 1px solid var(--glass-border); margin-bottom: 12px; z-index: 1; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .radio-controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .volume-box {
            padding: 10px 15px; margin-bottom: 12px; font-size: 12px;
            display: flex; align-items: center; justify-content: space-between; color: white;
        }

        .btn {
            background: rgba(255,255,255,0.05); color: white;
            border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; cursor: pointer;
            font-size: 13px; width: 100%; font-weight: bold; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .btn:active { transform: translateY(1px); }

        .btn-sos { background: linear-gradient(135deg, rgba(220, 38, 38, 0.8), rgba(153, 27, 27, 0.8)); border-color: rgba(248, 113, 113, 0.4); margin-top: 5px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        
        .btn-mic-on { background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.8)); border-color: rgba(52, 211, 153, 0.4); }
        .btn-mic-off { background: linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(185, 28, 28, 0.8)); border-color: rgba(248, 113, 113, 0.4); }
        .btn-speaker-on { background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(29, 78, 216, 0.8)); border-color: rgba(96, 165, 250, 0.4); }
        .btn-speaker-off { background: linear-gradient(135deg, rgba(71, 85, 105, 0.8), rgba(51, 65, 85, 0.8)); border-color: rgba(148, 163, 184, 0.4); color: #cbd5e1; }

        .msg-fab {
            position: fixed; bottom: 25px; left: 25px;
            background: rgba(59, 130, 246, 0.8); backdrop-filter: blur(10px); color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; z-index: 2000; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); transition: transform 0.3s;
        }
        .msg-fab:hover { transform: scale(1.1); }
        .msg-badge {
            position: absolute; top: -3px; right: -3px; background: var(--red-accent);
            color: white; font-size: 11px; font-weight: bold; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(239,68,68,0.5);
        }

        #msgModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); z-index: 10000; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }
        .msg-modal-content {
            width: 90%; max-width: 440px; padding: 20px; display: flex; flex-direction: column;
        }
        .messages-list {
            height: 280px; overflow-y: auto; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-top: 12px;
        }
        .msg-item {
            padding: 8px 12px; margin-bottom: 8px; border-radius: 8px;
            background: rgba(30, 41, 59, 0.5); border-right: 3px solid var(--blue-accent);
            font-size: 12px; color: #f8fafc; font-family: sans-serif;
        }
        .msg-item.commander { border-right-color: var(--gold-accent); background: rgba(245, 158, 11, 0.15); }
        .msg-item.sos { border-right-color: var(--red-accent); background: rgba(239, 68, 68, 0.15); }

        .status-msg { margin-top: 10px; color: var(--green-accent); font-size: 12px; text-align: center; text-shadow: 0 0 5px rgba(16,185,129,0.5); }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--blue-accent); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--blue-accent); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-grid-loop-31804-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="login-screen">
        <div class="login-box glass-panel">
            <h2>🛡️ چوونەژوورەوەی یەکەی ئەلفا</h2>
            <div class="input-group">
                <label>کلیل یان ناوی یەکە (نموونە: Alpha 1):</label>
                <input type="text" id="api-key-input" placeholder="Alpha 1">
            </div>
            <button class="btn" style="background: linear-gradient(135deg, var(--cyan-accent), #059669); color: #020617;" onclick="login()">چوونەژوورەوە 🔑</button>
            <div id="login-error" style="color:var(--red-accent); font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <div id="main-app">
        <div class="header-bar glass-panel">
            <div>یەکە: <span id="unit-name-display" style="color:var(--green-accent); font-weight:bold;">-</span></div>
            <div style="font-size:11px; color:#34d399; font-weight:bold; letter-spacing:1px;">● بێسیمی مەیدانی</div>
        </div>

        <div class="dash-info-bar glass-panel">
            <span id="coord-display">📍 پۆتان: دیاری نەکراوە</span>
            <span id="weather-info">🌤️ --°C</span>
        </div>

        <div id="map"></div>

        <div class="radio-controls-grid">
            <button class="btn btn-mic-off" id="micToggleBtn" onclick="toggleMicrophone()">🎙️ مایک: داخراوە</button>
            <button class="btn btn-speaker-on" id="speakerToggleBtn" onclick="toggleSpeaker()">🔊 گوێگرتن: کراوەتەوە</button>
            <button class="btn" id="radarToggleBtn" style="background: linear-gradient(135deg, #475569, #334155); color: #cbd5e1; grid-column: span 2;" onclick="toggleRadar()">📡 سیستەمی رادار: ۆف</button>
        </div>

        <div class="volume-box glass-panel">
            <label for="volControl">🔊 ئاستی دەنگی بێسیم:</label>
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="1" onchange="adjustVolume(this.value)">
        </div>

        <div class="controls-grid">
            <button class="btn" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.6), rgba(109, 40, 217, 0.6));" onclick="centerOnMe()">🧭 شوێنی من</button>
            <button class="btn" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.6), rgba(5, 150, 105, 0.6));" onclick="startGPS()">📡 دەستپێکردنی GPS</button>
        </div>

        <button class="btn btn-sos" onclick="sendSOS()">🚨 ناردنی نیشانەی مەترسی بەپەلە (SOS)</button>
        <p id="statusText" class="status-msg"></p>
    </div>

    <div class="msg-fab" onclick="toggleMsgModal()">
        📩
        <div class="msg-badge" id="unreadBadge" style="display:none;">0</div>
    </div>

    <div id="msgModal">
        <div class="msg-modal-content glass-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="color:var(--cyan-accent); font-size:14px; margin:0;">📜 سندوقی فەرمان و پەیامەکان</h3>
                <button onclick="toggleMsgModal()" style="background:var(--red-accent); color:white; border:none; border-radius:6px; padding:4px 10px; cursor:pointer; font-weight:bold;">✕</button>
            </div>
            <div class="messages-list" id="inboxList">
                <div class="msg-item"><b>سیستەم:</b> بەخێربێیت بۆ بەشی ئەلفای مەیدانی.</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        let map, userMarker, targetMarker;
        let currentUnitName = "";
        let watchId = null;
        let unreadCount = 0;

        let currentRouteLayer = null;
        let radarActive = false;
        let flightsLayer = L.layerGroup();
        let radarInterval;

        let micActive = false;
        let speakerActive = true;
        let localAudioStream = null;
        let peerConnections = {};
        let remoteAudioElements = {};

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let drawnItems = new L.FeatureGroup();

        function login() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return;
            socket.emit('register_alpha', { apiKey: key });
        }

        socket.on('registration_status', (res) => {
            if (res.success) {
                currentUnitName = res.alphaName;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('unit-name-display').innerText = currentUnitName;
                
                initMap();
                requestPermissions();
                initWebRTC();
            } else {
                document.getElementById('login-error').innerText = res.message || 'کلیلی سەربازی هەڵەیە!';
            }
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([36.19, 44.01], 15);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22,
                maxNativeZoom: 18,
                attribution: 'Esri Satellite'
            }).addTo(map);

            L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22,
                maxNativeZoom: 18,
                opacity: 0.8
            }).addTo(map);

            map.addLayer(drawnItems);
        }

        async function requestPermissions() {
            try {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { startGPS(); },
                        (err) => { console.warn("مۆڵەتی لۆکەیشن نەدراوە یان کێشەی هەیە."); }
                    );
                }
            } catch (err) {
                console.warn("مۆڵەتی لۆکەیشن نەدراوە.");
            }
        }

        function startGPS() {
            if (!navigator.geolocation) {
                document.getElementById('statusText').innerText = "مۆبایلەکەت پشتگیری GPS ناکات.";
                return;
            }
            document.getElementById('statusText').innerText = "پەیوەندی لەگەڵ ژووری ئۆپەراسیۆن چالاکە...";

            if (watchId) navigator.geolocation.clearWatch(watchId);

            const tacticalOptions = {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 15000 
            };

            watchId = navigator.geolocation.watchPosition((position) => {
                try {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let heading = position.coords.heading || 0;

                    document.getElementById('coord-display').innerText = `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                    if (!userMarker) {
                        userMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${currentUnitName} (تۆ)</b>`).openPopup();
                    } else {
                        userMarker.setLatLng([lat, lon]);
                    }
                    
                    if (!targetMarker && !currentRouteLayer) {
                        map.setView([lat, lon], 16);
                    }

                    socket.emit('updateLocation', {
                        id: currentUnitName,
                        lat: lat,
                        lon: lon,
                        heading: heading,
                        status: 'ئامادەباش',
                        lastSeen: Date.now()
                    });

                    try { fetchWeather(lat, lon); } catch(e) {}
                } catch(err) {
                    console.error("کێشە لە نوێکردنەوەی نەخشە:", err);
                }
            }, (error) => {
                let errorMsg = 'هەڵە لە وەرگرتنی GPS!';
                if (error.code === 1) errorMsg = 'مۆڵەتی GPS نەدراوە! تکایە لۆکەیشن بکەرەوە.';
                else if (error.code === 2) errorMsg = 'سیگناڵی GPS لاوازە، بڕۆ دەرەوەی ماڵ!';
                else if (error.code === 3) errorMsg = 'کات بەسەرچوو، دووبارە هەوڵدەداتەوە...';
                
                document.getElementById('statusText').innerText = errorMsg;
            }, tacticalOptions);
        }

        function fetchWeather(lat, lon) {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.current_weather) {
                        document.getElementById('weather-info').innerText = `🌤️ ${Math.round(data.current_weather.temperature)}°C | 💨 ${data.current_weather.windspeed} کم/ژ`;
                    }
                }).catch(() => {});
        }

        function centerOnMe() {
            if (userMarker) {
                map.setView(userMarker.getLatLng(), 17);
            } else {
                alert("چاوەڕێ بە تا لۆکەیشن دەگرێت یان GPS بکەرەوە.");
            }
        }
        
        function toggleRadar() {
            radarActive = !radarActive;
            const btn = document.getElementById('radarToggleBtn');
            if (radarActive) {
                btn.innerText = "📡 سیستەمی رادار: ۆن";
                btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                btn.style.color = "white";
                map.addLayer(flightsLayer);
                fetchRadarData(); 
            } else {
                btn.innerText = "📡 سیستەمی رادار: ۆف";
                btn.style.background = "linear-gradient(135deg, #475569, #334155)";
                btn.style.color = "#cbd5e1";
                map.removeLayer(flightsLayer);
                flightsLayer.clearLayers();
                if(radarInterval) clearInterval(radarInterval);
            }
        }

        function fetchRadarData() {
            let bounds = map.getBounds();
            
            fetch(`https://opensky-network.org/api/states/all?lamin=${bounds.getSouth() - 1}&lomin=${bounds.getWest() - 1}&lamax=${bounds.getNorth() + 1}&lomax=${bounds.getEast() + 1}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.states && data.states.length > 0) {
                    flightsLayer.clearLayers();
                    data.states.forEach(flight => {
                        let lat = flight[6]; let lon = flight[5]; let heading = flight[10] || 0;
                        if (lat && lon) {
                            L.polyline([[lat - 0.1, lon - 0.1], [lat, lon]], { color: '#f59e0b', weight: 2, dashArray: '4, 8' }).addTo(flightsLayer);
                            let icon = L.divIcon({
                                className: '',
                                html: `<div style="transform: rotate(${heading}deg); font-size: 20px; text-shadow: 0 0 5px #f59e0b;">✈️</div>`,
                                iconSize: [24, 24], iconAnchor: [12, 12]
                            });
                            L.marker([lat, lon], {icon: icon}).addTo(flightsLayer)
                            .bindPopup(`گەشتی ڕاستەقینە: ${flight[1] || 'نەزانراو'}<br>بەرزی: ${flight[7] || 0}م`);
                        }
                    });
                }
            }).catch(() => {});
            
            if(!radarInterval) radarInterval = setInterval(fetchRadarData, 10000);
        }

        async function initWebRTC() {
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
                });
                localAudioStream.getAudioTracks().forEach(t => t.enabled = false);
                socket.emit('webrtc_join_audio', { role: currentUnitName });
            } catch (err) {
                console.error("ڕێگەپێدانی مایکرۆفۆن بۆ WebRTC سەرکەوتوو نەبوو!", err);
            }
        }

        function toggleMicrophone() {
            if (!localAudioStream) {
                alert("مایک ئامادە نییە، تکایە ڕێگەپێدان بدە لە وێبگەڕەکەت!");
                return;
            }
            
            micActive = !micActive;
            localAudioStream.getAudioTracks().forEach(t => t.enabled = micActive);
            
            const micBtn = document.getElementById('micToggleBtn');
            if (micActive) {
                micBtn.innerText = "🎙️ مایک: کراوەتەوە";
                micBtn.className = "btn btn-mic-on";
            } else {
                micBtn.innerText = "🎙️ مایک: داخراوە";
                micBtn.className = "btn btn-mic-off";
            }
        }

        function toggleSpeaker() {
            speakerActive = !speakerActive;
            const spkBtn = document.getElementById('speakerToggleBtn');
            if (speakerActive) {
                spkBtn.innerText = "🔊 گوێگرتن: کراوەتەوە";
                spkBtn.className = "btn btn-speaker-on";
                Object.values(remoteAudioElements).forEach(a => a.muted = false);
            } else {
                spkBtn.innerText = "🔇 گوێگرتن: داخراوە";
                spkBtn.className = "btn btn-speaker-off";
                Object.values(remoteAudioElements).forEach(a => a.muted = true);
            }
        }

        socket.on('webrtc_peer_list', async (peers) => {
            if (!localAudioStream) return;
            for (let peerId of peers) {
                if (!peerConnections[peerId]) {
                    setupPeerConnection(peerId, true);
                }
            }
        });

        socket.on('webrtc_offer', async (data) => {
            const { from, offer } = data;
            let pc = setupPeerConnection(from, false);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            let answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc_answer', { target: from, answer: answer });
        });

        socket.on('webrtc_answer', async (data) => {
            const { from, answer } = data;
            if (peerConnections[from]) {
                await peerConnections[from].setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        socket.on('webrtc_ice_candidate', async (data) => {
            const { from, candidate } = data;
            if (peerConnections[from] && candidate) {
                try {
                    await peerConnections[from].addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('Error adding ice candidate', e);
                }
            }
        });

        function setupPeerConnection(peerId, isInitiator) {
            if (peerConnections[peerId]) return peerConnections[peerId];

            let pc = new RTCPeerConnection(rtcConfig);
            peerConnections[peerId] = pc;

            if (localAudioStream) {
                localAudioStream.getTracks().forEach(track => {
                    pc.addTrack(track, localAudioStream);
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_ice_candidate', { target: peerId, candidate: event.candidate });
                }
            };

            pc.ontrack = (event) => {
                if (!remoteAudioElements[peerId]) {
                    let audioEl = document.createElement('audio');
                    audioEl.autoplay = true;
                    audioEl.muted = !speakerActive;
                    let slider = document.getElementById('volControl');
                    audioEl.volume = slider ? slider.value : 1;
                    audioEl.srcObject = event.streams[0];
                    document.body.appendChild(audioEl);
                    remoteAudioElements[peerId] = audioEl;
                }
            };

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('webrtc_offer', { target: peerId, offer: offer });
                });
            }

            return pc;
        }

        socket.on('webrtc_peer_disconnected', (peerId) => {
            if (peerConnections[peerId]) {
                peerConnections[peerId].close();
                delete peerConnections[peerId];
            }
            if (remoteAudioElements[peerId]) {
                remoteAudioElements[peerId].remove();
                delete remoteAudioElements[peerId];
            }
        });

        function adjustVolume(val) {
            Object.values(remoteAudioElements).forEach(audio => {
                if(speakerActive) audio.volume = val;
            });
        }

        function sendSOS() {
            navigator.geolocation.getCurrentPosition((pos) => {
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;

                socket.emit('updateLocation', {
                    id: currentUnitName,
                    lat: lat,
                    lon: lon,
                    heading: 0,
                    status: 'SOS',
                    lastSeen: Date.now()
                });

                socket.emit('sosAlert', {
                    sender: currentUnitName,
                    time: new Date().toLocaleTimeString()
                });

                socket.emit('sendEmergencyMessage', {
                    sender: currentUnitName,
                    text: '🚨 هاواری بەپەلە (SOS) ڕەوانەکرا!',
                    type: 'SOS'
                });

                addMessageToInbox('🚨 **SOS**', 'نیشانەی مەترسی بەپەلە نێردرا بۆ فەرماندە!', 'sos');
                alert('⚠️ نیشانەی مەترسی (SOS) ڕەوانەکرا!');
            }, (err) => {
                alert("تکایە سەرەتا لۆکەیشن (GPS) بکەرەوە بۆ ئەوەی شوێنەکەت بنێردرێت!");
            }, { enableHighAccuracy: true });
        }

        socket.on('presidentBroadcast', (data) => {
            addMessageToInbox(data.sender || 'فەرماندەی گشتی', data.text, 'commander');
        });

        socket.on('receiveMessage', (data) => {
            addMessageToInbox(data.sender, data.text, 'normal');
        });

        // 🌟 وەرگرتنی هێڵکارییەکان و چارەسەری کێشەی بلۆکبوونی سڕینەوە لە سێرڤەر
        socket.on('tactical_draw', (data) => {
            // 🌟 چارەسەری بنەڕەتی: وەرگرتنی فەرمانی سڕینەوە لەناو هەمان ئیڤێنت
            if (data.type === 'clear') {
                drawnItems.clearLayers();
                return;
            }

            let layer; 
            const style = { color: '#3b82f6', weight: 3, opacity: 0.9, fillColor: '#3b82f6', fillOpacity: 0.25 };
            
            if (data.type === 'circle') layer = L.circle(data.latlng, { radius: data.radius, ...style });
            else if (data.type === 'polygon') layer = L.polygon(data.latlngs, style);
            else if (data.type === 'polyline') layer = L.polyline(data.latlngs, style);
            else if (data.type === 'rectangle') layer = L.rectangle(data.latlngs, style);
            else if (data.type === 'marker') layer = L.marker(data.latlng);
            
            if(layer) drawnItems.addLayer(layer);
        });

        socket.on('tactical_draw_clear', () => {
            drawnItems.clearLayers();
        });

        const handleCommanderTarget = (data) => {
            if (targetMarker) map.removeLayer(targetMarker);
            targetMarker = L.marker([data.lat, data.lon], {
                icon: L.divIcon({ className: 'custom-target', html: '🎯', iconSize: [30, 30] })
            }).addTo(map).bindPopup("<b>ئامانجی نێردراوی فەرماندە</b>").openPopup();
            
            addMessageToInbox('فەرماندەیی', 'ئامانجێکی نوێ لەسەر نەخشەکە دیاریکرا!', 'commander');

            if (userMarker) {
                let start = userMarker.getLatLng();
                if (currentRouteLayer) map.removeLayer(currentRouteLayer);
                
                let outline = L.polyline([start, [data.lat, data.lon]], { color: '#000000', weight: 6, opacity: 0.8 });
                let inline = L.polyline([start, [data.lat, data.lon]], { color: '#3b82f6', weight: 3, opacity: 1, dashArray: '10, 10' });
                
                currentRouteLayer = L.layerGroup([outline, inline]).addTo(map);
                map.fitBounds(currentRouteLayer.getBounds(), { padding: [30, 30] });
            } else {
                map.setView([data.lat, data.lon], 16);
            }
        };

        socket.on('update_commander_target', handleCommanderTarget);
        socket.on('set_commander_target', handleCommanderTarget);

        function addMessageToInbox(sender, text, type) {
            const inbox = document.getElementById('inboxList');
            const item = document.createElement('div');
            item.className = `msg-item ${type}`;
            item.innerHTML = `<b>${sender}:</b> ${text}<br><span style="font-size:9px; opacity:0.7;">${new Date().toLocaleTimeString()}</span>`;
            
            inbox.insertBefore(item, inbox.firstChild);
            
            unreadCount++;
            const badge = document.getElementById('unreadBadge');
            badge.innerText = unreadCount;
            badge.style.display = 'flex';
        }

        function toggleMsgModal() {
            const modal = document.getElementById('msgModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                unreadCount = 0;
                document.getElementById('unreadBadge').style.display = 'none';
            }
        }
    </script>
</body>
</html>
