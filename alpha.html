<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هێزی ئەلفا - ئۆپەراسیۆنی مەیدانی</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-deep: #0f172a; 
            --panel-bg: rgba(30, 41, 59, 0.85); 
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --accent-gold: #f59e0b;
            --danger-red: #ef4444;
            --success-green: #10b981;
            --border-color: rgba(148, 163, 184, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); overflow-x: hidden; }

        #auth-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; opacity: 0.3;
        }

        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(2,6,23,0.95)); z-index: 99999;
            display: flex; justify-content: center; align-items: center;
        }
        
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; width: 420px; text-align: center; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .glass-panel h2 { color: var(--text-main); font-size: 22px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
            color: white; border-radius: 8px; font-size: 15px; text-align: center; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        
        .btn {
            background: rgba(255,255,255,0.05); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; cursor: pointer;
            font-size: 13px; width: 100%; font-weight: bold; transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }

        #main-app { display: none; padding: 15px; max-width: 520px; margin: auto; position: relative; z-index: 10; }
        
        .panel-box {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 12px;
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; margin-bottom: 12px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px;
        }
        
        .dash-info-bar {
            padding: 10px 15px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--primary-blue);
            font-weight: bold;
        }

        #map { height: 320px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 12px; z-index: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .radio-controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .volume-box { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-main); }

        .btn-sos { background: var(--danger-red); border: none; margin-top: 5px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn-sos:hover { background: #dc2626; }
        
        .btn-mic-on { background: var(--success-green); color: white; border: none; }
        .btn-mic-off { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .btn-speaker-on { background: var(--primary-blue); color: white; border: none; }
        .btn-speaker-off { background: rgba(255,255,255,0.05); color: var(--text-muted); }

        .msg-fab {
            position: fixed; bottom: 25px; left: 25px;
            background: var(--primary-blue); color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; z-index: 2000; box-shadow: 0 8px 25px rgba(59,130,246,0.5);
            border: none; transition: 0.3s;
        }
        .msg-fab:hover { transform: scale(1.05); background: var(--primary-hover); }
        .msg-badge {
            position: absolute; top: -3px; right: -3px; background: var(--danger-red);
            color: white; font-size: 11px; font-weight: bold; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(239,68,68,0.5);
        }

        #msgModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 10000; display: none;
            justify-content: center; align-items: center;
        }
        .msg-modal-content {
            background: var(--bg-deep); border: 1px solid var(--border-color);
            width: 90%; max-width: 440px; padding: 25px; display: flex; flex-direction: column; border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .messages-list {
            height: 280px; overflow-y: auto; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-top: 15px;
        }
        .msg-item {
            padding: 8px 12px; margin-bottom: 8px; border-radius: 6px;
            background: rgba(255,255,255,0.05); border-left: 3px solid var(--primary-blue); font-size: 12px; color: var(--text-main);
        }
        .msg-item.commander { border-left-color: var(--gold-accent); background: rgba(245, 158, 11, 0.1); }
        .msg-item.sos { border-left-color: var(--danger-red); background: rgba(239, 68, 68, 0.1); color: #fca5a5; }

        .status-msg { margin-top: 10px; color: var(--success-green); font-size: 12px; text-align: center; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary-blue); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .arrow-marker { background: transparent; border: none; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <video autoplay muted loop id="auth-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-global-world-map-animation-31801-large.mp4" type="video/mp4">
        </video>
        <div class="auth-box glass-panel">
            <h2>🛡️ چوونەژوورەوەی یەکەی ئەلفا</h2>
            <div class="input-group">
                <label>ناوی یەکە (نموونە: Alpha 1):</label>
                <input type="text" id="api-key-input" placeholder="Alpha 1">
            </div>
            <button class="btn" style="background: var(--primary-blue); color: white; border:none;" onclick="login()">چوونەژوورەوە</button>
            <div id="login-error" style="color:#fca5a5; font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <div id="main-app">
        <div class="header-bar panel-box">
            <div>یەکە: <span id="unit-name-display" style="color:var(--success-green); font-weight:bold;">-</span></div>
            <div style="font-size:11px; color:var(--text-muted);"><span style="color:var(--success-green);">●</span> بێسیمی مەیدانی</div>
        </div>

        <div class="panel-box dash-info-bar">
            <span id="coord-display">📍 MGRS: چاوەڕوانی...</span>
            <span id="weather-info">🌤️ --°C</span>
        </div>

        <div id="map"></div>

        <div class="radio-controls-grid">
            <button class="btn btn-mic-off" id="micToggleBtn" onclick="toggleMicrophone()">🎙️ مایک: OFF</button>
            <button class="btn btn-speaker-on" id="speakerToggleBtn" onclick="toggleSpeaker()">🔊 گوێگرتن: ON</button>
        </div>

        <div class="panel-box volume-box">
            <label for="volControl">🔊 ئاستی دەنگی بێسیم:</label>
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="1" onchange="adjustVolume(this.value)">
        </div>

        <div class="controls-grid">
            <button class="btn" style="background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); color: #c4b5fd;" onclick="centerOnMe()">🧭 شوێنی من</button>
            <button class="btn" style="background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7;" onclick="startGPS()">📡 دەستپێکردنی GPS</button>
        </div>

        <button class="btn btn-sos" onclick="sendSOS()">🚨 ناردنی نیشانەی مەترسی بەپەلە (SOS)</button>
        <p id="statusText" class="status-msg"></p>
    </div>

    <div class="msg-fab" onclick="toggleMsgModal()">
        📩
        <div class="msg-badge" id="unreadBadge" style="display:none;">0</div>
    </div>

    <div id="msgModal">
        <div class="msg-modal-content glass-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <h3 style="color:var(--text-main); font-size:16px; margin:0;">سندوقی پەیامەکان</h3>
                <button onclick="toggleMsgModal()" style="background:rgba(239,68,68,0.1); color:var(--danger-red); border:none; border-radius:6px; padding:6px 12px; cursor:pointer;">داخستن</button>
            </div>
            <div class="messages-list" id="inboxList">
                <div class="msg-item"><b>سیستەم:</b> بەخێربێیت بۆ بەشی ئەلفای مەیدانی.</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mgrs/1.0.0/mgrs.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        let map, userMarker, targetMarker;
        let targetLine = null; 
        let currentUnitName = "";
        let watchId = null;
        let unreadCount = 0;
        let currentMGRS = "چاوەڕوانی لۆکەیشن...";
        let weatherAlertShown = false; 

        let micActive = false;
        let speakerActive = true;
        let localAudioStream = null;
        let peerConnections = {};
        let remoteAudioElements = {};

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

        function login() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) return;
            socket.emit('register_alpha', { apiKey: key });
        }

        socket.on('registration_status', (res) => {
            if (res.success) {
                currentUnitName = res.alphaName;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('unit-name-display').innerText = currentUnitName;
                
                initMap();
                requestPermissions();
                initWebRTC(); 
            } else {
                document.getElementById('login-error').innerText = res.message || 'کلیلی سەربازی هەڵەیە!';
            }
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([36.19, 44.01], 15);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22, maxNativeZoom: 18, attribution: 'Esri Satellite'
            }).addTo(map);
            L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 22, maxNativeZoom: 18, opacity: 0.8
            }).addTo(map);
        }

        let tacticalLayers = new L.FeatureGroup();
        map.addLayer(tacticalLayers);

        socket.on('tactical_draw', (data) => {
            let layer;
            if (data.type === 'circle') {
                layer = L.circle(data.latlng, { radius: data.radius, color: '#00ffcc', weight: 3, fillOpacity: 0.2 });
            } else if (data.type === 'polygon' || data.type === 'rectangle') {
                layer = L.polygon(data.latlngs, { color: '#00ffcc', weight: 3, fillOpacity: 0.2 });
            } else if (data.type === 'polyline') {
                layer = L.polyline(data.latlngs, { color: '#00ffcc', weight: 3 });
            } else if (data.type === 'marker') {
                layer = L.marker(data.latlng);
            }
            if (layer) { tacticalLayers.addLayer(layer); }
        });

        async function requestPermissions() {
            try {
                if (navigator.geolocation) { startGPS(); }
            } catch (err) { console.warn("مۆڵەتی لۆکەیشن نەدراوە."); }
        }

        function startGPS() {
            if (!navigator.geolocation) return;
            document.getElementById('statusText').innerText = "پەیوەندی لەگەڵ ژووری ئۆپەراسیۆن چالاکە...";

            if (watchId) navigator.geolocation.clearWatch(watchId);

            const tacticalOptions = { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 };

            watchId = navigator.geolocation.watchPosition((position) => {
                const accuracy = position.coords.accuracy;
                const displayEl = document.getElementById('coord-display');

                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let heading = position.coords.heading || 0;

                // فلتەری لۆکەیشن نەرم کراوە
                if (accuracy > 100) {
                    displayEl.innerText = `⚠️ سیگناڵ لاوازە (${Math.round(accuracy)}م)...`;
                }

                // 🌟 چارەسەری MGRS
                try {
                    currentMGRS = mgrs.forward([Number(lon), Number(lat)], 5);
                    displayEl.innerText = `📍 MGRS: ${currentMGRS}`;
                } catch(e) {
                    displayEl.innerText = `📍 MGRS: CALC_ERROR`;
                }

                // 🌟 ئایکۆنی کڵاوی سەربازی (🪖) بۆ ئەلفا خۆی
                if (!userMarker) {
                    let userIcon = L.divIcon({ className: 'arrow-marker', html: '<div style="font-size: 26px; filter: drop-shadow(0 0 8px #3b82f6);">🪖</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
                    userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map).bindPopup(`<b>${currentUnitName} (تۆ)</b>`).openPopup();
                } else {
                    userMarker.setLatLng([lat, lon]);
                }
                map.setView([lat, lon], 16);

                if (targetMarker && targetLine) {
                    targetLine.setLatLngs([userMarker.getLatLng(), targetMarker.getLatLng()]);
                }

                socket.emit('updateLocation', {
                    id: currentUnitName, lat: lat, lon: lon, heading: heading, status: 'ئامادەباش', lastSeen: Date.now()
                });

                // تەنیا ئەگەر زۆر پێویست بوو بانگی بکە
                // fetchWeather(lat, lon);
            }, (error) => {
                document.getElementById('statusText').innerText = 'هەڵە لە وەرگرتنی GPS!';
            }, tacticalOptions);
        }

        // کەشوهەوا لە کاتی پێویست
        function fetchWeather(lat, lon) {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.current_weather) {
                        let temp = Math.round(data.current_weather.temperature);
                        let wind = data.current_weather.windspeed;
                        let code = data.current_weather.weathercode;
                        
                        document.getElementById('weather-info').innerText = `🌤️ ${temp}°C | 💨 ${wind} km/h`;

                        let alertMsg = "";
                        if (code >= 61 && code <= 65) alertMsg = "⚠️ هۆشداری کەشوهەوا: باران بارینی بەلێزمە پێشبینی دەکرێت لە ناوچەکەتدا!";
                        else if (code >= 71 && code <= 75) alertMsg = "❄️ هۆشداری کەشوهەوا: بەفر بارین هەیە لە ناوچەکەتدا!";
                        else if (code >= 95) alertMsg = "⚡ هۆشداری کەشوهەوا: مەترسی بروسکە و گەردەلوول هەیە!";
                        else if (wind > 40) alertMsg = `🌪️ هۆشداری: ڕەشەبای بەهێز بە خێرایی (${wind} km/h) هەیە!`;

                        if (alertMsg !== "" && !weatherAlertShown) {
                            addMessageToInbox('🤖 سیستەمی زیرەک (AI)', alertMsg, 'sos');
                            weatherAlertShown = true; 
                        }
                    }
                }).catch(() => {});
        }

        function centerOnMe() {
            if (userMarker) { map.setView(userMarker.getLatLng(), 17); }
        }

        async function initWebRTC() {
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
                });
                localAudioStream.getAudioTracks().forEach(t => t.enabled = false);
                socket.emit('webrtc_join_audio', { role: currentUnitName });
            } catch (err) { console.error("مایک کێشەی هەیە!", err); }
        }

        function toggleMicrophone() {
            if (!localAudioStream) { alert("مایک ئامادە نییە، تکایە ڕێگەپێدان بدە!"); return; }
            micActive = !micActive;
            localAudioStream.getAudioTracks().forEach(t => t.enabled = micActive);
            
            const micBtn = document.getElementById('micToggleBtn');
            if (micActive) {
                micBtn.innerText = "🎙️ مایک: کراوەتەوە";
                micBtn.className = "btn btn-mic-on";
            } else {
                micBtn.innerText = "🎙️ مایک: داخراوە";
                micBtn.className = "btn btn-mic-off";
            }
        }

        function toggleSpeaker() {
            speakerActive = !speakerActive;
            const spkBtn = document.getElementById('speakerToggleBtn');
            if (speakerActive) {
                spkBtn.innerText = "🔊 گوێگرتن: کراوەتەوە";
                spkBtn.className = "btn btn-speaker-on";
                Object.values(remoteAudioElements).forEach(a => a.muted = false);
            } else {
                spkBtn.innerText = "🔇 گوێگرتن: داخراوە";
                spkBtn.className = "btn btn-speaker-off";
                Object.values(remoteAudioElements).forEach(a => a.muted = true);
            }
        }

        socket.on('webrtc_peer_list', async (peers) => {
            if (!localAudioStream) return;
            for (let peerId of peers) { if (!peerConnections[peerId]) { setupPeerConnection(peerId, true); } }
        });

        socket.on('webrtc_offer', async (data) => {
            const { from, offer } = data;
            let pc = setupPeerConnection(from, false);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            let answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc_answer', { target: from, answer: answer });
        });

        socket.on('webrtc_answer', async (data) => {
            const { from, answer } = data;
            if (peerConnections[from]) { await peerConnections[from].setRemoteDescription(new RTCSessionDescription(answer)); }
        });

        socket.on('webrtc_ice_candidate', async (data) => {
            const { from, candidate } = data;
            if (peerConnections[from] && candidate) {
                try { await peerConnections[from].addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
            }
        });

        function setupPeerConnection(peerId, isInitiator) {
            if (peerConnections[peerId]) return peerConnections[peerId];
            let pc = new RTCPeerConnection(rtcConfig);
            peerConnections[peerId] = pc;

            if (localAudioStream) {
                localAudioStream.getTracks().forEach(track => { pc.addTrack(track, localAudioStream); });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) socket.emit('webrtc_ice_candidate', { target: peerId, candidate: event.candidate });
            };

            pc.ontrack = (event) => {
                if (!remoteAudioElements[peerId]) {
                    let audioEl = document.createElement('audio');
                    audioEl.autoplay = true;
                    audioEl.muted = !speakerActive;
                    let slider = document.getElementById('volControl');
                    audioEl.volume = slider ? slider.value : 1;
                    audioEl.srcObject = event.streams[0];
                    document.body.appendChild(audioEl);
                    remoteAudioElements[peerId] = audioEl;
                }
            };

            if (isInitiator) {
                pc.createOffer().then(offer => { pc.setLocalDescription(offer); socket.emit('webrtc_offer', { target: peerId, offer: offer }); });
            }
            return pc;
        }

        socket.on('webrtc_peer_disconnected', (peerId) => {
            if (peerConnections[peerId]) { peerConnections[peerId].close(); delete peerConnections[peerId]; }
            if (remoteAudioElements[peerId]) { remoteAudioElements[peerId].remove(); delete remoteAudioElements[peerId]; }
        });

        function adjustVolume(val) {
            Object.values(remoteAudioElements).forEach(audio => { if(speakerActive) audio.volume = val; });
        }

        function sendSOS() {
            let lat = userMarker ? userMarker.getLatLng().lat : 0;
            let lon = userMarker ? userMarker.getLatLng().lng : 0;

            socket.emit('updateLocation', { id: currentUnitName, lat: lat, lon: lon, heading: 0, status: 'SOS', lastSeen: Date.now() });
            socket.emit('sosAlert', { sender: currentUnitName, time: new Date().toLocaleTimeString() });

            let emergencyText = `🚨 مەترسی گەورە لە ئەلفاوە!\n📍 MGRS: ${currentMGRS}\n🗺️ پۆتان: LAT: ${lat.toFixed(5)}, LNG: ${lon.toFixed(5)}`;

            socket.emit('sendEmergencyMessage', { sender: currentUnitName, text: emergencyText, type: 'SOS' });

            addMessageToInbox('🚨 **SOS**', 'پێگەی دەقیق و هۆشداری نێردرا بۆ فەرماندە!', 'sos');
            alert('⚠️ نیشانەی مەترسی دەقیق ڕەوانەکرا!');
        }

        socket.on('presidentBroadcast', (data) => {
            addMessageToInbox(data.sender || 'فەرماندەی گشتی', data.text, 'commander');
        });

        socket.on('receiveMessage', (data) => {
            addMessageToInbox(data.sender, data.text, 'normal');
        });

        const handleCommanderTarget = (data) => {
            if (targetMarker) map.removeLayer(targetMarker);
            if (targetLine) map.removeLayer(targetLine);

            targetMarker = L.marker([data.lat, data.lon], {
                icon: L.divIcon({ className: 'custom-target', html: '🎯', iconSize: [30, 30] })
            }).addTo(map).bindPopup("<b>ئامانجی نێردراوی فەرماندە</b>").openPopup();
            
            if (userMarker) {
                targetLine = L.polyline([userMarker.getLatLng(), [data.lat, data.lon]], {
                    color: '#3b82f6', weight: 4, dashArray: '10, 10', opacity: 0.8
                }).addTo(map);
            }
            
            map.setView([data.lat, data.lon], 16);
            addMessageToInbox('فەرماندەیی', 'ئامانجێکی نوێ دیاریکرا! هێڵی گەیشتن لەسەر نەخشەیە.', 'commander');
        };

        socket.on('update_commander_target', handleCommanderTarget);
        socket.on('set_commander_target', handleCommanderTarget);

        function addMessageToInbox(sender, text, type) {
            const inbox = document.getElementById('inboxList');
            const item = document.createElement('div');
            item.className = `msg-item ${type}`;
            let formattedText = text.replace(/\n/g, '<br>');
            item.innerHTML = `<b>${sender}:</b><br>${formattedText}<br><span style="font-size:9px; color:#94a3b8;">${new Date().toLocaleTimeString()}</span>`;
            inbox.insertBefore(item, inbox.firstChild);
            
            unreadCount++;
            const badge = document.getElementById('unreadBadge');
            badge.innerText = unreadCount;
            badge.style.display = 'flex';
        }

        function toggleMsgModal() {
            const modal = document.getElementById('msgModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                unreadCount = 0;
                document.getElementById('unreadBadge').style.display = 'none';
            }
        }
    </script>
</body>
</html>
